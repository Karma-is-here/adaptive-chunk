[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vanka-chunker"
version = "0.1.0"
description = "A pluggable, evaluation-driven document chunking engine"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=3.0",
]
test = [
    "pytest>=8.0",
]

[project.scripts]
vanka = "vanka.cli:main"

[tool.setuptools.packages.find]
where = ["src"]